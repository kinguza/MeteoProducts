name: Verify Supabase Secrets

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ok=true
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is empty or not set."
            echo "::error::Add it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            ok=false
          fi
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_KEY is empty or not set."
            echo "::error::Add it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            ok=false
          fi
          $ok || exit 1

          # Sanity-check the format, not the value (don't print the secret).
          if [[ "$SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "::warning::SUPABASE_URL doesn't look like a Supabase project URL (expected https://<ref>.supabase.co)"
            echo "::warning::Got: ${SUPABASE_URL:0:30}..."
          fi
          if [ ${#SUPABASE_SERVICE_KEY} -lt 100 ]; then
            echo "::warning::SUPABASE_SERVICE_KEY looks short (${#SUPABASE_SERVICE_KEY} chars)."
            echo "::warning::Service role keys are typically 200+ characters. Did you paste the anon key instead?"
          fi
          echo "SUPABASE_URL: ${#SUPABASE_URL} chars, starts with ${SUPABASE_URL:0:25}..."
          echo "SUPABASE_SERVICE_KEY: ${#SUPABASE_SERVICE_KEY} chars (not printed for safety)"
          echo "✓ Both secrets are present"

      - name: Verify Supabase connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Accept any 2xx as success. 200 = table exists with rows,
          # 200 with empty array = table exists but is empty (also fine).
          # 401/403 = credentials are wrong. 404 = project URL is wrong.
          # 5xx = Supabase is having an outage.
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/noaa_products?select=id&limit=1")
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          case "$STATUS" in
            2*)
              echo "✓ Supabase reachable, credentials valid (HTTP $STATUS)"
              echo "  Table response: ${BODY:0:200}"
              ;;
            401|403)
              echo "::error::Supabase rejected the credentials (HTTP $STATUS)."
              echo "::error::Double-check that SUPABASE_SERVICE_KEY is the SERVICE_ROLE key,"
              echo "::error::not the anon key. They look similar but are different."
              exit 1
              ;;
            404)
              echo "::error::Got HTTP 404 from Supabase. Possible causes:"
              echo "::error::  - SUPABASE_URL is wrong (check the project URL in Supabase settings)"
              echo "::error::  - The 'noaa_products' table doesn't exist (run supabase_schema.sql first)"
              exit 1
              ;;
            000)
              echo "::error::Could not reach $SUPABASE_URL at all. Check for typos in SUPABASE_URL."
              exit 1
              ;;
            *)
              echo "::error::Supabase check failed (HTTP $STATUS). Body: $BODY"
              exit 1
              ;;
          esac

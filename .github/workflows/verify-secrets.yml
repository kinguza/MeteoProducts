name: Verify Supabase Secrets

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is empty or not set"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_KEY is empty or not set"
            exit 1
          fi
          echo "SUPABASE_URL length: ${#SUPABASE_URL} characters"
          echo "SUPABASE_SERVICE_KEY length: ${#SUPABASE_SERVICE_KEY} characters"
          echo "SUPABASE_URL starts with: ${SUPABASE_URL:0:20}..."
          echo "✓ Both secrets are present"

      - name: Verify Supabase connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/noaa_products?select=id&limit=1")
          if [ "$STATUS" -eq 200 ]; then
            echo "✓ Supabase reachable, credentials valid (HTTP $STATUS)"
          else
            echo "::error::Supabase check failed (HTTP $STATUS) — check secret values"
            exit 1
          fi
